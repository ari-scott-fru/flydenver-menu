// ─── Main App ──────────────────────────────────────────────────────
function App() {
  const [currentView, setCurrentView] = useState('index');
  // URL-based routing for blog detail
  const getArticleFromURL = () => {
    const params = new URLSearchParams(window.location.search);
    return params.get('post');
  };

  const [currentArticle, setCurrentArticle] = useState(getArticleFromURL());

  useEffect(() => {
    if (getArticleFromURL()) {
      setCurrentView('article');
    }
  }, []);

  useEffect(() => {
    const onPopState = () => {
      const postId = getArticleFromURL();
      setCurrentArticle(postId);
      setCurrentView(postId ? 'article' : 'index');
    };
    window.addEventListener('popstate', onPopState);
    return () => window.removeEventListener('popstate', onPopState);
  }, []);

  const handlePostClick = (postId) => {
    setCurrentArticle(postId);
    setCurrentView('article');
    window.history.pushState({}, '', `?post=${postId}`);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const handleBack = () => {
    setCurrentView('index');
    setCurrentArticle(null);
    window.history.pushState({}, '', window.location.pathname);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const renderArticle = () => {
    switch (currentArticle) {
      case 'security-wait-times':
        return <SecurityArticle onBack={handleBack} onPostClick={handlePostClick} />;
      default:
        // Generic article fallback
        const post = posts.find(p => p.id === currentArticle);
        if (!post) return null;
        return (
          <div className="page-enter">
            <div className="relative bg-den-violet overflow-hidden grain-overlay">
              <div className="absolute inset-0">
                <img src={post.image} alt="" className="w-full h-full object-cover opacity-25" />
                <div className="absolute inset-0 bg-gradient-to-t from-den-violet via-den-violet/80 to-den-violet/50"></div>
              </div>
              <div className="relative z-10 max-w-4xl mx-auto px-5 md:px-10 pt-52 md:pt-60 pb-12 md:pb-20">
                <button onClick={handleBack} className="flex items-center gap-2 text-white/50 hover:text-white font-body text-sm transition-colors mb-6">
                  <i className="fa-solid fa-arrow-left text-xs"></i>Back to Blog
                </button>
                <CategoryBadge category={post.category} />
                <h1 className="headline-editorial text-3xl md:text-5xl text-white mt-4 mb-5">{post.title}</h1>
                <p className="font-body text-lg text-white/60 max-w-2xl mb-6">{post.excerpt}</p>
                <div className="flex flex-wrap items-center gap-4 text-sm font-body text-white/40">
                  <span>{post.author}</span>
                  <span className="w-1 h-1 rounded-full bg-white/30"></span>
                  <span>{post.date}</span>
                  <span className="w-1 h-1 rounded-full bg-white/30"></span>
                  <span>{post.readTime}</span>
                </div>
              </div>
            </div>
            <div className="max-w-3xl mx-auto px-5 md:px-10 py-12 md:py-20 article-body">
              <ShareButtons />
              <p className="mt-8 text-xl leading-relaxed text-gray-500">
                This is a prototype article page. In production, this would contain the full article content
                for "{post.title}". The template demonstrates the article layout, typography, and design system.
              </p>
              <div className="mt-16">
                <NewsletterCTA compact />
              </div>
              <div className="mt-16">
                <h2 className="font-editorial text-2xl text-den-violet mb-8 diagonal-accent pb-2">Related Stories</h2>
                <div className="grid sm:grid-cols-3 gap-6 stagger-in">
                  {posts.filter(p => p.id !== post.id).slice(0, 3).map(p => (
                    <PostCard key={p.id} post={p} onClick={handlePostClick} />
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
    }
  };

  return (
    <div className="min-h-screen" style={{backgroundColor: '#f7faff'}}>
      <BlogNav onHome={handleBack} />
      {currentView === 'index' ? (
        <BlogIndex onPostClick={handlePostClick} />
      ) : (
        renderArticle()
      )}
    </div>
  );
}

// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Live reload - poll for file changes
(function() {
  let lastModified = null;
  setInterval(async () => {
    try {
      const res = await fetch(window.location.href, { method: 'HEAD' });
      const modified = res.headers.get('Last-Modified');
      if (lastModified && modified !== lastModified) {
        window.location.reload();
      }
      lastModified = modified;
    } catch (e) {}
  }, 1000);
})();
</script>
